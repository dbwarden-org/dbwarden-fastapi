name: Publish to PyPI

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.6.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0

      - name: Verify release tag matches package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${{ github.event.release.tag_name }}" = "v$VERSION"

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Validate distributions
        run: |
          uvx --from twine==6.2.0 twine check dist/*
          unzip -t dist/*.whl
          uv venv /tmp/dbwarden-fastapi-wheel
          uv pip install --python /tmp/dbwarden-fastapi-wheel/bin/python dist/*.whl
          /tmp/dbwarden-fastapi-wheel/bin/python -c "import dbwarden_fastapi; assert dbwarden_fastapi.__version__ == '${{ github.event.release.tag_name }}'.removeprefix('v')"

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbwarden-fastapi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
